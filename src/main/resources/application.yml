server:
  port: 8080
  # Trusts X-Forwarded-* from the platform's edge proxy (Railway) so request.getRemoteAddr()
  # returns the real client IP everywhere in the app (audit log IPs, rate limiting) instead of
  # the proxy's own address — applied once, at the servlet level, instead of every call site
  # re-parsing the header itself.
  forward-headers-strategy: framework
  servlet:
    context-path: /

spring:
  application:
    name: boxy-be
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:boxy_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    # Templates render PDFs (see core.pdf.PdfDocumentService), not HTTP views — no MVC view
    # resolution happens through them, so caching only affects how quickly a template edit shows
    # up in the rendered PDF during development.
    cache: false

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: ALWAYS
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Application-specific properties
app:
  jwt:
    # No default on purpose: JwtTokenProvider refuses to start without a >= 64-byte secret.
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Short-lived on purpose — the refresh token (below) is what now carries the real session
    # length, safely, via rotation + reuse detection + an httpOnly cookie.
    expiration-ms: ${JWT_EXPIRATION:900000} # 15 minutes
  refresh-token:
    expiration-ms: ${REFRESH_TOKEN_EXPIRATION:2592000000} # 30 days
  device:
    # Whether RefreshTokenService#rotate revokes a session when the presented X-Device-Fingerprint
    # doesn't match what was bound at login — the boxy_did cookie match is always enforced
    # regardless of this flag. Set to false if the fingerprint signal proves too noisy in practice
    # (a real browser update or an unusual device-signal change would otherwise force a re-login).
    enforce-fingerprint: ${DEVICE_ENFORCE_FINGERPRINT:true}
    # 400 days: Chrome's own cap on Set-Cookie Max-Age. Deliberately much longer than the refresh
    # token's 30 days — the device stays "known" (skips new-device alerts) well past any single
    # session's lifetime.
    cookie-max-age-days: ${DEVICE_COOKIE_MAX_AGE_DAYS:400}
  auth-cookie:
    # false only for local HTTP development (see boxy-fe's dev proxy); a real deployment is
    # always HTTPS, and the cookie must never go out over plain HTTP there.
    secure: ${AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://boxy-fe.vercel.app}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600
  recaptcha:
    # Off by default only because there's no secret yet in most environments — set
    # RECAPTCHA_ENABLED=false explicitly for local dev once a secret is configured, so a
    # deployment can never silently run without it once it's meant to be on (see RecaptchaService).
    enabled: ${RECAPTCHA_ENABLED:true}
    secret: ${RECAPTCHA_SECRET:6LdfjtYtAAAAAIx8M4ZAdJVoZITuFjomdNOPsiEi}
    #secret: ${RECAPTCHA_SECRET:INVALID_SECRET_KEY_12345}
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}
    verify-url: https://www.google.com/recaptcha/api/siteverify

# OpenAPI / Swagger — off by default; only turn on in an environment where exposing the
# API schema publicly is acceptable (never production).
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
